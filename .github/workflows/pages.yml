name: Publicar en GitHub Pages

# Solo se ejecuta manualmente, cuando la persona propietaria decide publicar.
# Requiere activar Pages con «GitHub Actions» como fuente (Settings → Pages).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar para la subruta del repositorio
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Variables del repositorio (Settings → Secrets and variables → Actions → Variables).
          # Sin configurarlas, se publica la demostración no registrada.
          VITE_APP_MODE: ${{ vars.VITE_APP_MODE || 'demo' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
